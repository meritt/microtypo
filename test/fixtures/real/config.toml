Правила заставы:
1) не разжигать костры ближе 50 м от частокола;
2) не кормить волков - даже "ручных";
3) о следах длиной больше 20 см - немедленно докладывать.
"""
motto = '''Арден помнит - Арден хранит'''

[supplies]
