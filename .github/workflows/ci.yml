name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Toolchain
        uses: pnpm/setup@v2
        with:
          cache: true
          require-lockfile: true

      - name: Lint
        run: pnpm lint --format=github

      - name: Format
        run: pnpm format:check

      - name: ReDoS
        run: pnpm lint:redos

      - name: Coverage
        run: pnpm coverage

      - name: Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          format: lcov
          fail-on-error: false
